app_admin:
    resource: "routes/admin/*.yaml"
    prefix: /admin

app_admin_api:
    prefix: /admin/api
    resource: "routes/admin_api/*.yaml"

endpoint:
    resource: ../src/Endpoint
    type: endpoint

app_controllers:
    resource: ../src/Controller/
    type: attribute

app_get_started:
    path: /get-started
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    defaults:
        template: 'theme/resource/page/show.html.twig'
        context: { page_type: 'docs' }
